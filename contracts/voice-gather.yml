sample: voice-gather

env:
  BW_ACCOUNT_ID: "9900000"
  BW_CLIENT_ID: fake-client-id
  BW_CLIENT_SECRET: fake-client-secret
  BW_VOICE_APPLICATION_ID: "00000000-0000-0000-0000-000000000000"
  BW_NUMBER: "+19195554321"
  BASE_CALLBACK_URL: https://example.invalid
  LOCAL_PORT: "{port}"

startup:
  ready_timeout_seconds: 30
  # each case blanks or breaks one var and expects a non-zero exit
  failure_cases:
    - { id: T2-account-id, unset: BW_ACCOUNT_ID }
    - { id: T2-client-id, unset: BW_CLIENT_ID }
    - { id: T2-client-secret, unset: BW_CLIENT_SECRET }
    - { id: T2-application-id, unset: BW_VOICE_APPLICATION_ID }
    - { id: T2-number, unset: BW_NUMBER }
    - { id: T2-callback-url, unset: BASE_CALLBACK_URL }
    - { id: T2-port, unset: LOCAL_PORT }
    - { id: T2-port-not-int, set: { LOCAL_PORT: not-a-port } }

fixtures_dir: fixtures/voice-gather

cases:
  - id: T3
    name: answer returns Gather BXML
    request: { method: POST, path: /callbacks/outbound/voice, fixture: answer.json }
    expect:
      status: 200
      content_type: application/xml
      bxml:
        root: Response
        children:
          - tag: Gather
            attrs:
              gatherUrl_ends_with: /callbacks/outbound/voice/gather
              terminatingDigits: "#"
            children:
              - { tag: SpeakSentence, text: "Press 1 to choose option 1. Press 2 to choose option 2. Press pound when you are finished." }

  - id: T4
    name: initiate speaks and hangs up
    request: { method: POST, path: /callbacks/outbound/voice, fixture: initiate.json }
    expect:
      status: 200
      content_type: application/xml
      bxml:
        root: Response
        children:
          - { tag: SpeakSentence, text: "Initiate event received but not intended. Ending call." }
          - { tag: Hangup }

  - id: T5
    name: disconnect returns an empty Response
    request: { method: POST, path: /callbacks/outbound/voice, fixture: disconnect.json }
    expect:
      status: 200
      content_type: application/xml
      bxml: { root: Response, children: [] }

  - id: T6
    name: outbound voice rejects malformed body
    request: { method: POST, path: /callbacks/outbound/voice, fixture: malformed.txt }
    expect: { status: 400 }

  - id: T7
    name: gather digit 1
    request: { method: POST, path: /callbacks/outbound/voice/gather, fixture: gather-1.json }
    expect:
      status: 200
      content_type: application/xml
      bxml:
        root: Response
        children:
          - { tag: SpeakSentence, text: "You chose option 1. Goodbye." }

  - id: T8
    name: gather digit 2
    request: { method: POST, path: /callbacks/outbound/voice/gather, fixture: gather-2.json }
    expect:
      status: 200
      content_type: application/xml
      bxml:
        root: Response
        children:
          - { tag: SpeakSentence, text: "You chose option 2. Goodbye." }

  - id: T9
    name: gather invalid digit
    request: { method: POST, path: /callbacks/outbound/voice/gather, fixture: gather-9.json }
    expect:
      status: 200
      content_type: application/xml
      bxml:
        root: Response
        children:
          - { tag: SpeakSentence, text: "You did not choose a valid option. Goodbye." }

  - id: T10
    name: gather rejects wrong eventType
    request: { method: POST, path: /callbacks/outbound/voice/gather, fixture: answer.json }
    expect: { status: 400 }

  - id: T11
    name: gather rejects malformed body
    request: { method: POST, path: /callbacks/outbound/voice/gather, fixture: malformed.txt }
    expect: { status: 400 }

  - id: T12
    name: create call rejects a missing to
    request: { method: POST, path: /calls, fixture: calls-no-to.json }
    expect: { status: 400 }

  # needs a Bandwidth stub, same as voice-record's download case
  - id: T13
    name: create call succeeds
    skip: true
    request: { method: POST, path: /calls, fixture: calls-valid.json }
    expect: { status: 200 }
