name: Sample contract (Java)

on:
  workflow_call:
    inputs:
      sample:
        description: Contract to check against, e.g. voice-record
        required: true
        type: string
      working-directory:
        required: false
        type: string
        default: .
      java-version:
        required: false
        type: string
        default: "21"
      install-command:
        required: false
        type: string
        default: mvn -B -DskipTests package
      start-command:
        required: false
        type: string
        default: mvn -B spring-boot:run

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout App
        uses: actions/checkout@v7
        with:
          path: app

      - name: Checkout Tooling
        uses: actions/checkout@v7
        with:
          repository: Bandwidth-Samples/sample-app-tooling
          path: tooling

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install app dependencies
        working-directory: app/${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}

      - name: Install runner dependencies
        run: pip install -r tooling/runner/requirements.txt

      - name: Run contract
        run: >
          python tooling/runner/run_contract.py
          --contract tooling/contracts/${{ inputs.sample }}.yml
          --fixtures-root tooling
          --app-dir app/${{ inputs.working-directory }}
          --start-command "${{ inputs.start-command }}"
          --log-file ${{ runner.temp }}/app.log

      - name: Show app log
        if: failure()
        run: cat ${{ runner.temp }}/app.log
